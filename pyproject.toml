[project]
name = "yuque2obsidian"
version = "0.1.0"
description = "把语雀（Yuque）中的全部笔记完整迁移到 Obsidian 的 Python 工具。"
authors = [{name = "dreamsong"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "gradio>=4.0.0",
    "huggingface-hub<0.25",
    "python-slugify>=8.0.0",
    "tenacity>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/dreamay/yuque2obsidian"

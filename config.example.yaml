# 复制本文件为 config.yaml 并填入你的 Token，只需要填写 Token 即可

yuque:
  token: "your-yuque-token-here"    # 必填，从 https://www.yuque.com/settings/tokens 创建
  base_url: "https://www.yuque.com/api/v2"
  # 浏览器 Cookie（用于表格/画板等非官方 API 导出）
  # 获取方式：浏览器登录语雀 → F12 → Network → 复制请求头中的 Cookie 值
  # 可以是完整 cookie 字符串，也可以只填 _yuque_session 的值
  # 不需要填写，暂时只为测试新功能用
  cookie: ""

export:
  output_dir: "./obsidian_vault"    # Obsidian 库输出目录
  assets_dir: "assets"              # 资源文件夹名
  include_personal: true            # 导出个人知识库
  include_groups: true              # 导出团队/协作知识库
  incremental: true                 # 默认启用增量同步
  full_sync: false                  # 是否强制全量同步
  concurrency: 5                    # API 并发数
  rate_limit: 1.3                   # 每秒最大请求数（5000/小时 ≈ 1.39/s）

frontmatter:
  include_source_url: true
  include_created_at: true
  include_updated_at: true
  include_tags: true

ui:
  enabled: false
  port: 7860
